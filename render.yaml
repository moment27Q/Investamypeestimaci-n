# Blueprint de Render: conecta el repo y Render crea el Web Service.
# Usa runtime docker porque Render no permite "su root" (el --with-deps de
# Playwright falla en runtime: node). El Dockerfile instala Chromium + deps.
services:
  - type: web
    name: tasador-peru
    runtime: docker
    plan: free
    region: ohio
    healthCheckPath: /healthz
    envVars:
      - key: GROK_MODEL
        value: llama-3.3-70b-versatile
      # Clave secreta: en el panel de Render (Dashboard > tu servicio > Environment)
      # pulsa "Add Environment Variable" y pega tu clave con valor GROK_API_KEY.
      # Con sync:false, Render la pide al desplegar.
      - key: GROK_API_KEY
        sync: false
