# Blueprint de Render: conecta el repo y Render crea el Web Service.
# Más info: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tasador-peru
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install && npx playwright install --with-deps chromium
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: GROK_MODEL
        value: llama-3.3-70b-versatile
      # Clave secreta: en el panel de Render (Dashboard > tu servicio > Environment)
      # pulsa "New Environment Group" / "Add Environment Variable" y pega tu clave
      # con valor GROK_API_KEY. Con sync:false, Render la pide al desplegar.
      - key: GROK_API_KEY
        sync: false
